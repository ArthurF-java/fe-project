name: App buid

on:
  push:
    branches:
      - dev

env:
  BUILD_NAME: "${{ vars.DOCKER_HUB_USERNAME }}/${{ vars.PROJECT_NAME }}"
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set FULL_BUILD_NAME
        id: extract-full-build-name
        run: |
          FULL_BUILD_NAME=$BUILD_NAME:${{ github.sha }}
          echo "FULL_BUILD_NAME=$FULL_BUILD_NAME" >> $GITHUB_ENV

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

#      - name: Determine environment variables
#        id: env
#        run: |
#          if [[ $GITHUB_REF == refs/heads/dev ]]; then
#            echo "REACT_APP_API_KEY=${{ secrets.DEV_REACT_APP_API_KEY }}" > .env
#            echo "REACT_APP_BASE_URL=${{ secrets.DEV_REACT_APP_BASE_URL }}" >> .env
#          elif [[ $GITHUB_REF == refs/heads/test ]]; then
#            echo "REACT_APP_API_KEY=${{ secrets.TEST_REACT_APP_API_KEY }}" > .env
#            echo "REACT_APP_BASE_URL=${{ secrets.TEST_REACT_APP_BASE_URL }}" >> .env
#          elif [[ $GITHUB_REF == refs/heads/prod ]]; then
#            echo "REACT_APP_API_KEY=${{ secrets.PROD_REACT_APP_API_KEY }}" > .env
#            echo "REACT_APP_BASE_URL=${{ secrets.PROD_REACT_APP_BASE_URL }}" >> .env
#          fi
#          cat .env  # Optional: Print the .env file for debugging

      - name: Create .env file dev
        if: steps.extract_branch.outputs.branch == 'dev'
        run: |
          echo "REACT_APP_BASE_URL=${{ vars.DEV_BE_BASE_URL }}" >> .env

      - name: Create .env file test
        if: steps.extract_branch.outputs.branch == 'test'
        run: |
          echo "REACT_APP_BASE_URL=${{ vars.TEST_BE_BASE_URL }}" >> .env

      - name: Create .env file prod
        if: steps.extract_branch.outputs.branch == 'prod'
        run: |
          echo "REACT_APP_BASE_URL=${{ vars.PROD_BE_BASE_URL }}" >> .env

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $FULL_BUILD_NAME .

      - name: Push Docker image
        run: docker push $FULL_BUILD_NAME
